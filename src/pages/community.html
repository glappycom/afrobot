<section class="split-hero">
  <div class="split-hero__copy">
    <p class="kicker">Community</p>
    <h1 class="h1">Every adult around a child needs a clear way in.</h1>
    <p class="lead">Mentors are screened before they work with students.</p>
    <p>Children take part through a parent or guardian.</p>
    <a class="btn btn--clay" href="#register">Register interest</a>
  </div>
  <figure class="split-hero__photo">
    <picture>
      <source sizes="(max-width: 900px) 100vw, 58vw" srcset="assets/photos/bamenda-laptop-row-800.avif 800w, assets/photos/bamenda-laptop-row.avif 2000w" type="image/avif">
      <source sizes="(max-width: 900px) 100vw, 58vw" srcset="assets/photos/bamenda-laptop-row-800.webp 800w, assets/photos/bamenda-laptop-row.webp 2000w" type="image/webp">
      <img src="assets/photos/bamenda-laptop-row.jpg" alt="A row of children working side by side on laptops in a classroom" width="2000" height="1500" fetchpriority="high" decoding="async">
    </picture>
  </figure>
</section>
<section class="section band-quiet community-roles">
  <div class="container">
    {{roles}}
  </div>
</section>
{{register}}
