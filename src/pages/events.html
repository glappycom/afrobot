<section class="page-hero">
  <div class="container">
    <p class="kicker">Events</p>
    <h1 class="h1">No upcoming AfroBot event is on the calendar.</h1>
  </div>
</section>
<section class="section">
  <div class="container">
    <div class="prose">
      <h2>Past: McKinney, Texas, 2024</h2>
      <p>An AfroBot program was held in McKinney, Texas, in 2024.</p>
    </div>
    <div class="split gap-top">
      <figure class="photo">
        <div class="photo__img photo__img--real ratio-4x3 photo--controlled">
          <video class="photo__video" controls playsinline preload="metadata" poster="assets/video/mckinney-build-day-2024-poster.jpg">
            <source src="assets/video/mckinney-build-day-2024.mp4" type="video/mp4">
          </video>
        </div>
        <figcaption>AfroBot program, McKinney, Texas, 2024.</figcaption>
      </figure>
      <figure class="photo">
        <div class="photo__img photo__img--real ratio-4x3"><picture><source srcset="assets/photos/mckinney-build-day-2024.avif" type="image/avif"><source srcset="assets/photos/mckinney-build-day-2024.webp" type="image/webp"><img src="assets/photos/mckinney-build-day-2024.jpg" alt="A big group of kids and mentors pose with the robots they built, three robots on the floor in front" width="1800" height="1350" loading="lazy" decoding="async"></picture></div>
      </figure>
    </div>
    <p class="gap-top"><a class="btn btn--clay" href="index.html?intent=join#register">Register interest</a></p>
  </div>
</section>
<section class="section band-quiet" id="stories" aria-labelledby="stories-title">
  <div class="container">
    <h2 id="stories-title" class="h1">Stories from the program</h2>
    <div class="card-grid card-grid--stories">
      {{videos}}
    </div>
  </div>
</section>
