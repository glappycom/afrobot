<section class="page-hero">
  <div class="container">
    <p class="kicker">Events</p>
    <h1 class="h1">No upcoming AfroBot event is on the calendar.</h1>
  </div>
</section>
<section class="section">
  <div class="container">
    <div class="prose">
      <h2>McKinney Build Day</h2>
      <p>Kids and mentors worked with robots in McKinney, Texas, in 2024.</p>
    </div>
    <div class="split gap-top">
      <figure class="photo">
        <div class="photo__img photo__img--real ratio-4x3 photo--controlled">
          <video class="photo__video" controls playsinline preload="metadata" poster="assets/video/mckinney-build-day-2024-poster.jpg">
            <source src="assets/video/mckinney-build-day-2024.mp4" type="video/mp4">
          </video>
        </div>
        <figcaption>Kids and mentors worked with robots in McKinney, Texas, in 2024.</figcaption>
      </figure>
      <figure class="photo">
        <div class="photo__img photo__img--real ratio-4x3"><picture><source srcset="assets/photos/mckinney-build-day-2024.avif" type="image/avif"><source srcset="assets/photos/mckinney-build-day-2024.webp" type="image/webp"><img src="assets/photos/mckinney-build-day-2024.jpg" alt="A big group of kids and mentors pose with the robots they built, three robots on the floor in front" width="1800" height="1350" loading="lazy" decoding="async"></picture></div>
      </figure>
    </div>
    <div class="place-grid gap-top">
      <figure>
        <picture>
          <source srcset="assets/photos/mckinney-ai-track-2024.webp" type="image/webp">
          <img src="assets/photos/mckinney-ai-track-2024.jpg" alt="Kids at tables with their robots while a presenter teaches at a screen" width="1200" height="900" loading="lazy" decoding="async">
        </picture>
        <figcaption>An AI session in McKinney, Texas, in 2024.</figcaption>
      </figure>
      <figure>
        <picture>
          <source srcset="assets/photos/bamenda-desktop-focus.avif" type="image/avif">
          <source srcset="assets/photos/bamenda-desktop-focus.webp" type="image/webp">
          <img src="assets/photos/bamenda-desktop-focus.jpg" alt="Children focused on a desktop screen" width="980" height="735" loading="lazy" decoding="async">
        </picture>
        <figcaption>Students work at a desktop.</figcaption>
      </figure>
      <figure>
        <picture>
          <source srcset="assets/photos/bamenda-class-celebration.avif" type="image/avif">
          <source srcset="assets/photos/bamenda-class-celebration.webp" type="image/webp">
          <img src="assets/photos/bamenda-class-celebration.jpg" alt="A classroom group in white lab coats" width="980" height="735" loading="lazy" decoding="async">
        </picture>
        <figcaption>A class gathers indoors.</figcaption>
      </figure>
    </div>
    <h2 class="h1 gap-top">From the program</h2>
    <div class="place-grid">
      <figure>
        <picture>
          <source srcset="assets/photos/bamenda-robotics-kit.avif" type="image/avif">
          <source srcset="assets/photos/bamenda-robotics-kit.webp" type="image/webp">
          <img src="assets/photos/bamenda-robotics-kit.jpg" alt="A small group studying instructions beside a robotics kit" width="980" height="735" loading="lazy" decoding="async">
        </picture>
        <figcaption>Students study a robotics kit.</figcaption>
      </figure>
      <figure>
        <picture>
          <source srcset="assets/photos/bamenda-coding-desktop.avif" type="image/avif">
          <source srcset="assets/photos/bamenda-coding-desktop.webp" type="image/webp">
          <img src="assets/photos/bamenda-coding-desktop.jpg" alt="Two children at a desktop with a block-coding screen" width="980" height="735" loading="lazy" decoding="async">
        </picture>
        <figcaption>Students code at a desktop.</figcaption>
      </figure>
      <figure>
        <picture>
          <source srcset="assets/photos/bamenda-lab-coats.avif" type="image/avif">
          <source srcset="assets/photos/bamenda-lab-coats.webp" type="image/webp">
          <img src="assets/photos/bamenda-lab-coats.jpg" alt="An outdoor group in white lab coats" width="980" height="735" loading="lazy" decoding="async">
        </picture>
        <figcaption>Students meet outdoors.</figcaption>
      </figure>
    </div>
    <p class="gap-top"><a class="btn btn--clay" href="community.html?intent=updates#register">Get updates</a></p>
  </div>
</section>
<section class="section band-quiet" id="stories" aria-labelledby="stories-title">
  <div class="container">
    <h2 id="stories-title" class="h1">Stories from the program</h2>
    <div class="card-grid card-grid--stories">
      {{videos}}
    </div>
  </div>
</section>
