name: Evidence platform demo

on:
  pull_request:
  push:
    paths:
      - platform-app/**
      - docs/platform/**
      - .github/workflows/platform-demo.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: platform-app
